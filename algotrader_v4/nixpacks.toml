[phases.setup]
nixPkgs = ["python311", "nodejs_20", "gcc", "libffi"]

[phases.install]
cmds = [
  "pip install --upgrade 'setuptools<60' wheel --quiet",
  "pip install -r requirements.txt --quiet",
  "cd frontend && npm ci --prefer-offline && npm run build && cd .."
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level warning"

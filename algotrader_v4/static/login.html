<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AlgoTrader Pro — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #58a6ff;
    }
    .logo span { color: #3fb950; }

    .subtitle {
      color: #8b949e;
      font-size: 0.82rem;
      margin-bottom: 36px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-desc {
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.9rem;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #58a6ff; }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-blue { background: #1f6feb; color: #fff; }
    .btn-blue:hover:not(:disabled) { background: #388bfd; }

    .status {
      margin-top: 14px;
      font-size: 0.8rem;
      min-height: 20px;
      text-align: center;
    }
    .status.ok   { color: #3fb950; }
    .status.err  { color: #f85149; }
    .status.info { color: #58a6ff; }

    .footer-link {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #8b949e;
      text-align: center;
    }
    .footer-link a { color: #58a6ff; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="logo">AlgoTrader <span>Pro</span></div>
  <p class="subtitle">NSE · Tick-driven · SEBI Compliant</p>

  <div class="card">
    <div class="card-title">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="#58a6ff">
        <path d="M8 0a4 4 0 1 0 0 8A4 4 0 0 0 8 0zm0 10c-4 0-6 1.8-6 2.7V14h12v-1.3C14 11.8 12 10 8 10z"/>
      </svg>
      Sign In
    </div>
    <p class="card-desc">Enter your credentials to access the dashboard</p>

    <label for="username">Username</label>
    <input id="username" type="text" placeholder="admin" autocomplete="username"/>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>

    <button class="btn btn-blue" id="login-btn" onclick="doLogin()">Sign In</button>

    <div class="status" id="login-status"></div>
  </div>

  <p class="footer-link">
    Broker connection &amp; API keys → <a href="/dashboard">Settings tab</a> after login
  </p>

  <script>
    const BASE = window.location.origin;

    // Auto-redirect if already logged in
    window.addEventListener('DOMContentLoaded', async () => {
      const stored = localStorage.getItem('jwtToken');
      if (stored) {
        try {
          const res = await fetch(`${BASE}/auth/me`, {
            headers: { 'Authorization': `Bearer ${stored}` }
          });
          if (res.ok) {
            window.location.replace('/dashboard');
            return;
          }
        } catch {}
        localStorage.removeItem('jwtToken');
      }
    });

    async function doLogin() {
      const btn = document.getElementById('login-btn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        setStatus('err', 'Enter username and password');
        return;
      }
      btn.disabled = true;
      setStatus('info', 'Signing in…');

      try {
        const res = await fetch(`${BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');

        localStorage.setItem('jwtToken', data.access_token);
        localStorage.setItem('username', username);
        setStatus('ok', 'Welcome! Redirecting…');
        setTimeout(() => window.location.replace('/dashboard'), 600);
      } catch (e) {
        setStatus('err', e.message);
        btn.disabled = false;
      }
    }

    function setStatus(type, msg) {
      const el = document.getElementById('login-status');
      el.className = `status ${type}`;
      el.textContent = msg;
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlgoTrader Pro — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; margin: 0; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: #F1F5F9; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 2px; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
  .toast-in { animation: toastIn .2s ease-out; }
</style>
<script>tailwind.config = { theme: { extend: { fontFamily: { mono: ['JetBrains Mono','monospace'] } } } };</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-50">
<div id="root"></div>

<script type="text/babel" src="ds.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Watchlist.jsx"></script>
<script type="text/babel" src="MainChart.jsx"></script>
<script type="text/babel" src="OrderPanel.jsx"></script>
<script type="text/babel" src="BottomTabs.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Toasts({ toasts, remove }) {
  const colors = { buy: 'bg-green-600', sell: 'bg-red-600', info: 'bg-indigo-600', error: 'bg-red-700' };
  return (
    <div className="fixed bottom-4 right-4 flex flex-col gap-2 z-50">
      {toasts.map(t => (
        <div key={t.id} onClick={() => remove(t.id)}
          className={cx('toast-in flex items-center gap-3 px-4 py-3 rounded-xl text-white text-sm font-medium shadow-lg cursor-pointer', colors[t.type])}>
          {t.msg}
        </div>
      ))}
    </div>
  );
}

function SettingsModal({ open, onClose }) {
  const [tab, setTab] = useState('connection');
  const T = { connection: 'Connection', apikeys: 'API Keys', applogin: 'App Login' };
  return (
    <Modal open={open} onClose={onClose} title="Settings">
      <div className="flex border-b border-slate-200 mb-4 -mt-1">
        {Object.keys(T).map(k => (
          <button key={k} onClick={() => setTab(k)}
            className={cx('px-4 py-2 text-sm font-medium border-b-2 transition-colors',
              tab === k ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700')}>{T[k]}</button>
        ))}
      </div>
      {tab === 'connection' && (
        <div className="space-y-4">
          <div><label className="block text-sm font-medium text-slate-700 mb-1">API Base URL</label><Input defaultValue="http://localhost:8000" /></div>
          <div><label className="block text-sm font-medium text-slate-700 mb-1">X-API-Key</label><Input type="password" placeholder="Leave empty if not set" /></div>
          <div className="flex gap-2 pt-2"><Btn onClick={onClose}>Save &amp; Reconnect</Btn><Btn variant="outline" onClick={onClose}>Cancel</Btn></div>
        </div>
      )}
      {tab === 'apikeys' && (
        <div className="space-y-4">
          <div>
            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Kite (Zerodha)</p>
            <div className="space-y-3">
              <div className="flex items-center justify-between mb-1"><label className="text-sm font-medium text-slate-700">API Key</label><Badge variant="buy">Set ✓</Badge></div>
              <Input type="password" placeholder="Leave blank to keep current" />
              <div className="flex items-center justify-between mb-1"><label className="text-sm font-medium text-slate-700">API Secret</label><Badge variant="warning">Not set</Badge></div>
              <Input type="password" placeholder="Leave blank to keep current" />
            </div>
          </div>
          <p className="text-xs text-slate-400">In-memory only — restart reverts to environment variables.</p>
          <div className="flex gap-2 pt-1"><Btn onClick={onClose}>Save Credentials</Btn><Btn variant="outline" onClick={onClose}>Cancel</Btn></div>
        </div>
      )}
      {tab === 'applogin' && (
        <div className="space-y-4">
          <div><label className="block text-sm font-medium text-slate-700 mb-1">Admin Username</label><Input defaultValue="admin" /></div>
          <div><label className="block text-sm font-medium text-slate-700 mb-1">New Password</label><Input type="password" placeholder="Min 8 characters" /></div>
          <div className="flex gap-2 pt-1"><Btn onClick={onClose}>Update Login</Btn><Btn variant="outline" onClick={onClose}>Cancel</Btn></div>
        </div>
      )}
    </Modal>
  );
}

function App() {
  const [ticks, setTicks] = useState(seedTicks);
  const [selected, setSelected] = useState('RELIANCE');
  const [positions, setPositions] = useState([]);
  const [orders, setOrders] = useState([]);
  const [toasts, setToasts] = useState([]);
  const [botRunning, setBotRunning] = useState(false);
  const [agentState, setAgentState] = useState({ intraday: true, fno: false, swing: true, scalping: true });
  const [tab, setTab] = useState('positions');
  const [settings, setSettings] = useState(false);
  const [dailyPnl, setDailyPnl] = useState(0);
  const tid = useRef(0);

  // live ticking
  useEffect(() => {
    const t = setInterval(() => setTicks(p => stepTicks(p)), 1200);
    return () => clearInterval(t);
  }, []);

  // recompute daily P&L from open positions
  useEffect(() => {
    const pnl = positions.reduce((a, p) => a + ((ticks[p.symbol]?.ltp ?? p.avg) - p.avg) * p.qty, 0);
    setDailyPnl(pnl);
  }, [ticks, positions]);

  const addToast = (msg, type = 'info') => {
    const id = ++tid.current;
    setToasts(p => [...p, { id, msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
  };
  const removeToast = id => setToasts(p => p.filter(t => t.id !== id));

  const placeOrder = ({ symbol, side, qty, orderType, product, price }) => {
    const oid = '24' + Math.floor(Math.random() * 1e13);
    const time = new Date().toLocaleTimeString('en-IN', { hour12: false });
    setOrders(p => [{ id: oid, time, symbol, side, qty, orderType, product }, ...p]);
    setPositions(prev => {
      const signed = side === 'BUY' ? qty : -qty;
      const ex = prev.find(p => p.symbol === symbol);
      if (ex) {
        const newQty = ex.qty + signed;
        const newAvg = newQty !== 0 ? (ex.avg * ex.qty + price * signed) / newQty : ex.avg;
        return prev.map(p => p.symbol === symbol ? { ...p, qty: newQty, avg: newAvg } : p);
      }
      return [...prev, { symbol, qty: signed, avg: price, product }];
    });
    addToast(`${side} ${qty} ${symbol} → ${oid}`, side === 'BUY' ? 'buy' : 'sell');
  };

  const squareOff = () => {
    const n = positions.filter(p => p.qty !== 0).length;
    setPositions([]);
    addToast(`Squared off ${n} position${n !== 1 ? 's' : ''}`, 'info');
  };

  const toggleBot = () => {
    setBotRunning(r => {
      addToast(r ? 'Bot stopped' : 'Bot started — 8 symbols', r ? 'info' : 'buy');
      return !r;
    });
  };
  const toggleAgent = name => setAgentState(s => ({ ...s, [name]: !s[name] }));

  const tick = ticks[selected];
  const hasPositions = positions.some(p => p.qty !== 0);

  return (
    <div className="flex flex-col h-screen bg-slate-50 overflow-hidden">
      <Header mode="PAPER" marketOpen={true} botRunning={botRunning} onToggleBot={toggleBot} onOpenSettings={() => setSettings(true)} />
      <div className="flex flex-1 min-h-0">
        <div className="w-52 shrink-0 bg-slate-50 border-r border-slate-200 flex flex-col">
          <div className="px-3 py-2 border-b border-slate-200"><span className="text-xs font-semibold text-slate-600 uppercase tracking-wide">Watchlist</span></div>
          <div className="flex-1 min-h-0"><Watchlist ticks={ticks} selected={selected} onSelect={setSelected} /></div>
        </div>
        <div className="flex-1 flex flex-col min-w-0">
          <div className="flex flex-1 min-h-0">
            <div className="flex-1 border-b border-slate-200 min-w-0"><MainChart symbol={selected} tick={tick} /></div>
            <div className="w-64 shrink-0 border-l border-slate-200 bg-white overflow-hidden">
              <OrderPanel symbol={selected} tick={tick} onPlace={placeOrder} onSquareOff={squareOff} hasPositions={hasPositions} />
            </div>
          </div>
          <BottomTabs active={tab} setActive={setTab} positions={positions} ticks={ticks} orders={orders}
            dailyPnl={dailyPnl} botRunning={botRunning} agentState={agentState} onToggleAgent={toggleAgent} />
        </div>
      </div>
      <Toasts toasts={toasts} remove={removeToast} />
      <SettingsModal open={settings} onClose={() => setSettings(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

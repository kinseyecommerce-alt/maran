<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-card); padding:22px; display:flex; align-items:center; gap:40px; }
  .mark { width:48px; height:48px; background:var(--brand); border-radius:var(--r-md); display:flex; align-items:center; justify-content:center; }
  .full { display:flex; align-items:center; gap:10px; }
  .wt1 { font-size:16px; font-weight:700; color:var(--fg1); line-height:1; }
  .wt2 { font-size:12px; color:var(--fg3); line-height:1; margin-top:3px; }
</style>
</head>
<body>
  <div class="mark">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
  </div>
  <div class="full">
    <div class="mark" style="width:40px;height:40px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </div>
    <div>
      <div class="wt1">AlgoTrader Pro</div>
      <div class="wt2">Nirma Trade v4</div>
    </div>
  </div>
</body>
</html>

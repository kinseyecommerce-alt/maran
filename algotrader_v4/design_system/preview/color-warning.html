<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-app); padding:18px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line); background:var(--bg-card); }
  .chip { height:60px; }
  .meta { padding:8px 10px; }
  .name { font-size:12px; font-weight:600; color:var(--fg1); }
  .hex { font-family:var(--font-mono); font-size:11px; color:var(--fg3); margin-top:2px; text-transform:uppercase; }
  .use { font-size:10px; color:var(--fg4); margin-top:3px; line-height:1.3; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background:#F59E0B"></div>
      <div class="meta"><div class="name">Amber 500</div><div class="hex">#F59E0B</div><div class="use">Warn · gauge mid</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#FEF3C7"></div>
      <div class="meta"><div class="name">Amber 100</div><div class="hex">#FEF3C7</div><div class="use">PAPER · warning badge</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#92400E"></div>
      <div class="meta"><div class="name">Amber 800</div><div class="hex">#92400E</div><div class="use">Warning badge text</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#FFFBEB"></div>
      <div class="meta"><div class="name">Amber 50</div><div class="hex">#FFFBEB</div><div class="use">Caution inline block</div></div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-card); padding:22px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:var(--r-sm); font-size:12px; font-weight:600; }
  .buy { background:var(--buy-tint); color:var(--buy-strong); }
  .sell { background:var(--sell-tint); color:var(--sell-strong); }
  .neutral { background:var(--bg-subtle); color:var(--fg2); }
  .warn { background:var(--warn-tint); color:var(--warn-strong); }
  .dot { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--fg2); }
  .d { width:8px; height:8px; border-radius:50%; }
</style>
</head>
<body>
  <div class="row">
    <span class="badge live" style="background:var(--buy-tint);color:var(--buy-strong)">LIVE</span>
    <span class="badge warn">PAPER</span>
    <span class="badge buy">+150</span>
    <span class="badge sell">-75</span>
    <span class="badge neutral">MIS</span>
    <span class="badge warn">Not set</span>
    <span class="badge buy">Set ✓</span>
    <span class="dot"><span class="d" style="background:var(--buy-dot)"></span>Market OPEN</span>
    <span class="dot"><span class="d" style="background:var(--fg4)"></span>Offline</span>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-card); padding:20px; }
  .grid { display:flex; gap:28px; align-items:flex-end; }
  .col { }
  .tag { font-family:var(--font-mono); font-size:10px; color:var(--fg4); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .big { font-family:var(--font-mono); font-weight:700; font-size:26px; font-variant-numeric:tabular-nums; color:var(--fg1); }
  .row2 { display:flex; gap:18px; margin-top:14px; }
  .price { font-family:var(--font-mono); font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <div class="grid">
    <div class="col">
      <div class="tag">Symbol price · 26</div>
      <div class="big">₹2,847.50</div>
    </div>
    <div class="col">
      <div class="tag">Daily P&amp;L</div>
      <div class="big" style="color:var(--buy)">+₹12,340</div>
    </div>
  </div>
  <div class="row2">
    <span class="price ds-price-up">+1.24%</span>
    <span class="price ds-price-down">-0.80%</span>
    <span class="price" style="color:var(--fg1)">RSI 58</span>
    <span class="price" style="color:var(--fg3)">12:43:07 IST</span>
  </div>
</body>
</html>

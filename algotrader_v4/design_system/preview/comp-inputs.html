<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-card); padding:20px; display:flex; gap:16px; }
  .col { flex:1; }
  label { display:block; font-size:12px; font-weight:500; color:var(--fg3); margin-bottom:5px; }
  input, select { width:100%; box-sizing:border-box; font-family:var(--font-sans); font-size:14px; color:var(--fg1); border:1px solid var(--line); border-radius:var(--r-md); padding:8px 12px; background:#fff; }
  input:focus { outline:none; border-color:transparent; box-shadow:0 0 0 2px var(--brand-tint-line); }
  input::placeholder { color:var(--fg4); }
  .focused { border-color:transparent; box-shadow:0 0 0 2px var(--brand-tint-line); }
</style>
</head>
<body>
  <div class="col">
    <label>Quantity</label>
    <input type="text" value="5">
    <label style="margin-top:14px">API Base URL</label>
    <input class="focused" type="text" placeholder="http://localhost:8000">
  </div>
  <div class="col">
    <label>Order Type</label>
    <select><option>MARKET</option></select>
    <label style="margin-top:14px">Product</label>
    <select><option>MIS</option></select>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-card); padding:0; }
  .tabs { display:flex; border-bottom:1px solid var(--line-subtle); }
  .tab { display:flex; align-items:center; gap:6px; padding:11px 16px; font-size:12px; font-weight:500; color:var(--fg3); border-bottom:2px solid transparent; cursor:pointer; }
  .tab.active { color:var(--brand); border-bottom-color:var(--brand); background:rgba(238,242,255,.5); }
  .tab .count { background:var(--brand); color:#fff; border-radius:50%; width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; }
  .wrap { padding:18px; }
  .seg { display:inline-grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--bg-subtle); border-radius:var(--r-lg); }
  .seg button { border:none; font-family:var(--font-sans); font-weight:700; font-size:13px; padding:8px 24px; border-radius:var(--r-md); cursor:pointer; background:transparent; color:var(--fg2); }
  .seg .on-buy { background:var(--buy); color:#fff; box-shadow:var(--shadow-sm); }
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab active">📋 Positions <span class="count">3</span></div>
    <div class="tab">📝 Orders</div>
    <div class="tab">🎯 Brackets</div>
    <div class="tab">⚠️ Risk</div>
    <div class="tab">🤖 Agents</div>
    <div class="tab">🛡️ SEBI</div>
  </div>
  <div class="wrap">
    <div class="seg">
      <button class="on-buy">▲ BUY</button>
      <button>▼ SELL</button>
    </div>
  </div>
</body>
</html>

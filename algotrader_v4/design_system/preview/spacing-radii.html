<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-app); padding:20px; }
  .row { display:flex; gap:16px; align-items:flex-end; }
  .item { text-align:center; }
  .box { width:64px; height:64px; background:var(--bg-card); border:1.5px solid var(--brand); }
  .name { font-size:11px; font-weight:600; color:var(--fg1); margin-top:8px; }
  .val { font-family:var(--font-mono); font-size:10px; color:var(--fg3); margin-top:1px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">sm · 4</div><div class="val">badges</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">md · 8</div><div class="val">buttons</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="name">lg · 12</div><div class="val">cards</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="name">xl · 16</div><div class="val">modals</div></div>
    <div class="item"><div class="box" style="border-radius:9999px"></div><div class="name">full</div><div class="val">dots</div></div>
  </div>
</body>
</html>

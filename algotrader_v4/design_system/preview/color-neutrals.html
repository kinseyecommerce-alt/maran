<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-app); padding:18px; }
  .row { display:flex; gap:8px; }
  .sw { flex:1; }
  .chip { height:52px; border-radius:6px; border:1px solid rgba(15,23,42,.06); }
  .name { font-size:11px; font-weight:600; color:var(--fg1); margin-top:6px; }
  .hex { font-family:var(--font-mono); font-size:10px; color:var(--fg3); margin-top:1px; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#F8FAFC"></div><div class="name">Canvas</div><div class="hex">slate-50</div></div>
    <div class="sw"><div class="chip" style="background:#F1F5F9"></div><div class="name">Subtle</div><div class="hex">slate-100</div></div>
    <div class="sw"><div class="chip" style="background:#E2E8F0"></div><div class="name">Border</div><div class="hex">slate-200</div></div>
    <div class="sw"><div class="chip" style="background:#94A3B8"></div><div class="name">fg4</div><div class="hex">slate-400</div></div>
    <div class="sw"><div class="chip" style="background:#64748B"></div><div class="name">fg3</div><div class="hex">slate-500</div></div>
    <div class="sw"><div class="chip" style="background:#334155"></div><div class="name">fg2</div><div class="hex">slate-700</div></div>
    <div class="sw"><div class="chip" style="background:#0F172A"></div><div class="name">fg1</div><div class="hex">slate-900</div></div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-app); padding:16px; display:flex; gap:14px; }
  .wl { width:208px; background:var(--bg-card); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; }
  .rowit { display:flex; flex-direction:column; padding:10px 12px; border-bottom:1px solid var(--line-subtle); }
  .rowit.sel { background:var(--brand-tint); border-left:2px solid var(--brand-tint-line); }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .sym { font-size:12px; font-weight:600; color:var(--fg1); }
  .pct { font-family:var(--font-mono); font-size:12px; font-weight:600; }
  .ltp { font-family:var(--font-mono); font-size:14px; font-weight:700; color:var(--fg1); margin-top:3px; }
  .chips { display:flex; gap:6px; margin-top:5px; }
  .chip { font-size:11px; padding:0 6px; border-radius:var(--r-sm); font-weight:500; }
  .up { background:#DCFCE7; color:#15803D; } .dn { background:#FEE2E2; color:#B91C1C; }
  .rsi { font-family:var(--font-mono); font-size:11px; color:var(--fg4); }
</style>
</head>
<body>
  <div class="wl">
    <div class="rowit sel">
      <div class="top"><span class="sym">▲ RELIANCE</span><span class="pct" style="color:var(--buy)">+1.24%</span></div>
      <div class="ltp">₹2,847.50</div>
      <div class="chips"><span class="chip up">UP</span><span class="rsi">RSI 58</span></div>
    </div>
    <div class="rowit">
      <div class="top"><span class="sym">▼ TCS</span><span class="pct" style="color:var(--sell)">-0.80%</span></div>
      <div class="ltp">₹3,912.00</div>
      <div class="chips"><span class="chip dn">DOWN</span><span class="rsi">RSI 42</span></div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-card); padding:20px; }
  .item { display:flex; align-items:baseline; gap:14px; padding:7px 0; border-bottom:1px solid var(--line-subtle); }
  .item:last-child { border-bottom:none; }
  .tag { width:120px; flex-shrink:0; font-family:var(--font-mono); font-size:10px; color:var(--fg4); text-transform:uppercase; letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="item"><span class="tag">Body · 400 · 14</span><span class="ds-body">Square off ALL positions at market price?</span></div>
  <div class="item"><span class="tag">Label · 500 · 12</span><span class="ds-label">Quantity</span></div>
  <div class="item"><span class="tag">Caption · 400 · 12</span><span class="ds-caption">In-memory only — restart reverts to environment variables.</span></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-card); padding:20px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .row + .row { margin-top:12px; }
  button { font-family:var(--font-sans); font-weight:500; font-size:14px; border:none; border-radius:var(--r-md); padding:8px 16px; cursor:pointer; transition:background .15s; }
  .primary { background:var(--brand); color:#fff; }
  .buy { background:var(--buy); color:#fff; }
  .sell { background:var(--sell); color:#fff; }
  .ghost { background:transparent; color:var(--fg2); }
  .outline { background:#fff; color:var(--fg2); border:1px solid var(--line); }
  .danger-out { background:#fff; color:var(--sell); border:1px solid var(--sell-tint); }
  .sm { padding:5px 12px; font-size:13px; }
  .lg { padding:12px 24px; font-size:15px; font-weight:700; }
  .dis { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
  <div class="row">
    <button class="primary">Save &amp; Reconnect</button>
    <button class="buy">Start Bot</button>
    <button class="sell">Stop Bot</button>
    <button class="outline">Cancel</button>
    <button class="ghost">Pause</button>
  </div>
  <div class="row">
    <button class="primary sm">Resume</button>
    <button class="primary lg">BUY 5 RELIANCE</button>
    <button class="danger-out sm">Square Off All Positions</button>
    <button class="primary dis">Saving…</button>
  </div>
</body>
</html>

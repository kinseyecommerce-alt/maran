<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-app); padding:18px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line); background:var(--bg-card); }
  .chip { height:60px; }
  .meta { padding:8px 10px; }
  .name { font-size:12px; font-weight:600; color:var(--fg1); }
  .hex { font-family:var(--font-mono); font-size:11px; color:var(--fg3); margin-top:2px; text-transform:uppercase; }
  .use { font-size:10px; color:var(--fg4); margin-top:3px; line-height:1.3; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background:#4F46E5"></div>
      <div class="meta"><div class="name">Indigo 600</div><div class="hex">#4F46E5</div><div class="use">Brand · primary buttons · active nav</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#4338CA"></div>
      <div class="meta"><div class="name">Indigo 700</div><div class="hex">#4338CA</div><div class="use">Primary hover</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#6366F1"></div>
      <div class="meta"><div class="name">Indigo 500</div><div class="hex">#6366F1</div><div class="use">Accent border · progress</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#EEF2FF"></div>
      <div class="meta"><div class="name">Indigo 50</div><div class="hex">#EEF2FF</div><div class="use">Selected row wash</div></div>
    </div>
  </div>
</body>
</html>

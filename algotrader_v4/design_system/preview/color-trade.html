<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-app); padding:18px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line); background:var(--bg-card); }
  .chip { height:60px; }
  .meta { padding:8px 10px; }
  .name { font-size:12px; font-weight:600; color:var(--fg1); }
  .hex { font-family:var(--font-mono); font-size:11px; color:var(--fg3); margin-top:2px; text-transform:uppercase; }
  .use { font-size:10px; color:var(--fg4); margin-top:3px; line-height:1.3; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background:#16A34A"></div>
      <div class="meta"><div class="name">Buy / Green 600</div><div class="hex">#16A34A</div><div class="use">BUY · gains · uptrend</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#DCFCE7"></div>
      <div class="meta"><div class="name">Green 100</div><div class="hex">#DCFCE7</div><div class="use">Buy badge bg</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#DC2626"></div>
      <div class="meta"><div class="name">Sell / Red 600</div><div class="hex">#DC2626</div><div class="use">SELL · losses · downtrend</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#FEE2E2"></div>
      <div class="meta"><div class="name">Red 100</div><div class="hex">#FEE2E2</div><div class="use">Sell badge bg</div></div>
    </div>
  </div>
</body>
</html>

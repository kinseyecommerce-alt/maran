<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-app); padding:18px; display:flex; gap:14px; }
  .card { flex:1; background:var(--bg-card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); padding:16px; text-align:center; }
  .card.run { border-color:#BBF7D0; }
  .k { font-size:12px; color:var(--fg3); margin-bottom:6px; }
  .v { font-family:var(--font-mono); font-weight:700; font-size:24px; color:var(--fg1); font-variant-numeric:tabular-nums; }
  .agent { display:flex; align-items:flex-start; gap:8px; text-align:left; }
  .agent .em { font-size:22px; }
  .agent .n { font-size:14px; font-weight:700; color:var(--fg1); }
  .agent .d { font-size:11px; color:var(--fg3); margin-top:2px; }
  .gd { width:9px; height:9px; border-radius:50%; background:var(--buy-dot); margin-left:auto; margin-top:3px; }
</style>
</head>
<body>
  <div class="card">
    <div class="k">Daily P&amp;L</div>
    <div class="v" style="color:var(--buy)">+₹12,340</div>
    <div class="k" style="margin-top:4px;color:var(--fg4)">Limit: ₹50,000</div>
  </div>
  <div class="card run">
    <div class="agent">
      <span class="em">⚡</span>
      <div>
        <div class="n">Intraday</div>
        <div class="d">VWAP+EMA momentum, MIS</div>
      </div>
      <span class="gd"></span>
    </div>
  </div>
</body>
</html>

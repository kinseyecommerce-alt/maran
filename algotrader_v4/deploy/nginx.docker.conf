# nginx config for Docker Compose deployments
# Mounted at /etc/nginx/conf.d/algotrader.conf inside the nginx:alpine container.
#
# Prerequisites before starting the stack:
#   1. Obtain a Let's Encrypt certificate on the host first:
#        sudo certbot certonly --standalone -d yourdomain.com
#   2. Substitute your real domain in this file (or pass DOMAIN via envsubst):
#        sed -i 's/yourdomain\.com/yourdomain.com/g' nginx.docker.conf
#   3. docker compose up -d
#
# The /etc/letsencrypt volume is mounted read-only from the host so the cert
# files are available inside the container.

upstream algotrader_app {
    server algotrader:8000;   # Docker service name — resolves inside the compose network
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # TLS — cert obtained via: certbot certonly --standalone -d yourdomain.com
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Proxy all traffic to uvicorn (via Docker network)
    location / {
        proxy_pass         http://algotrader_app;
        proxy_http_version 1.1;

        # WebSocket upgrade (tick engine / live P&L stream)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  300s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
    }
}

[phases.setup]
nixPkgs = ["python312", "gcc", "libffi"]

[phases.install]
cmds = [
  "cd ema-rsi-intraday-algo/backend && pip install --upgrade pip setuptools wheel",
  "cd ema-rsi-intraday-algo/backend && pip install -r requirements.txt",
  "cd ema-rsi-intraday-algo/backend && (python -m playwright install chromium || true)",
]

[start]
cmd = "cd ema-rsi-intraday-algo/backend && uvicorn app.api.server:app --host 0.0.0.0 --port $PORT --workers 1 --loop uvloop --http httptools --log-level warning --access-log"

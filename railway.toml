[build]
builder = "NIXPACKS"
buildCommand = "cd algotrader_v4 && pip install --upgrade pip && pip install -r requirements.txt"

[deploy]
startCommand = "cd algotrader_v4 && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --loop uvloop --http httptools --log-level warning --access-log"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[build]
builder = "NIXPACKS"
buildCommand = "cd ema-rsi-intraday-algo/backend && pip install --upgrade pip && pip install -r requirements.txt && (python -m playwright install chromium || true)"

[deploy]
startCommand = "cd ema-rsi-intraday-algo/backend && uvicorn app.api.server:app --host 0.0.0.0 --port $PORT --workers 1 --loop uvloop --http httptools --log-level warning --access-log"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

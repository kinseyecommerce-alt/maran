name: algotrader
region: blr
services:
  - name: web
    source_dir: /
    build_command: pip install -r algotrader_v4/requirements.txt
    run_command: cd algotrader_v4 && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level warning
    http_port: 8080
    github:
      branch: main
      deploy_on_push: true
    instance_size_slug: basic-xs
    instance_count: 1
    health_check:
      http_path: /readiness
      timeout_seconds: 10
      period_seconds: 30
